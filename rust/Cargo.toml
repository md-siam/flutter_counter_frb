[package]
name = "rust_lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_lib"
crate-type = ["cdylib", "staticlib"]

[dependencies]
log = "0.4.29"
env_logger = "0.11.10"
flutter_rust_bridge = "=2.12.0"
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
